name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jomallmm1116/contratistas-planta

jobs:
  # ---- 1. Compilacion y pruebas contra una base real ----
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: contratistas_ci
          TZ: America/Guatemala
          PGTZ: America/Guatemala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d contratistas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/contratistas_ci?sslmode=disable
      JWT_SECRET: secreto-solo-para-pruebas-automaticas-de-ci-2026
      DEMO_PASSWORD: CiDemo2026
      NODE_ENV: test
      LOG_LEVEL: error

    defaults:
      run:
        working-directory: server

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Instalar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Compilar (typecheck)
        run: npm run typecheck

      - name: Aplicar migraciones con dbmate
        working-directory: .
        run: >
          docker run --rm --network host
          -v "$PWD/db:/db"
          -e DATABASE_URL="$DATABASE_URL"
          ghcr.io/amacneil/dbmate:2
          --wait --migrations-dir /db/migrations --no-dump-schema up

      - name: Cargar datos de demostracion
        run: npm run db:seed && npm run db:seed:flujo

      - name: Ejecutar pruebas
        run: npm test

  # ---- 2. Imagen Docker publicada en GHCR (solo en push y si las pruebas pasaron) ----
  imagen:
    needs: pruebas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 3. Despliegue en el servidor de produccion ----
  desplegar:
    needs: imagen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Nunca dos despliegues a la vez; si llega otro, espera su turno
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar la conexion SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copiar compose y migraciones al servidor
        run: |
          scp -i ~/.ssh/deploy docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/contratistas-planta/"
          scp -i ~/.ssh/deploy -r db "$DEPLOY_USER@$DEPLOY_HOST:/opt/contratistas-planta/"

      - name: Actualizar la aplicacion
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "Desplegando la version $TAG"
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "TAG=$TAG bash -s" <<'REMOTO'
          set -euo pipefail
          cd /opt/contratistas-planta
          # Version exacta en el .env: queda registrada y se puede volver atras
          sed -i "s/^APP_TAG=.*/APP_TAG=${TAG}/" .env
          docker compose -f docker-compose.prod.yml pull app
          # Aplica migraciones pendientes y reinicia la app con la nueva imagen
          docker compose -f docker-compose.prod.yml up -d
          for intento in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Version ${TAG} en linea"
              docker image prune -f
              exit 0
            fi
            sleep 2
          done
          echo "La aplicacion no respondio despues del despliegue"
          docker compose -f docker-compose.prod.yml logs --tail 50 app
          exit 1
          REMOTO

      - name: Verificar el sitio publico con HTTPS
        run: curl -fsS "https://planta.jomadev.online/api/health"
